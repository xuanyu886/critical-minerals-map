<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>世界关键矿产分布图</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">关键矿产 · 示意分布</p>
        <h1>世界关键矿产分布图</h1>
        <p class="intro">聚合锂、钴、镍、稀土、铜、石墨、铂族金属、铀的主要生产与储量集中区域。</p>
      </div>
      <button class="icon-button" id="resetView" type="button" aria-label="重置筛选">
        <span aria-hidden="true">↺</span>
      </button>
    </header>

    <main>
      <section class="map-section" aria-label="世界关键矿产地图">
        <div class="toolbar" id="filters" aria-label="矿种筛选"></div>

        <div class="map-shell">
          <svg class="world-map" viewBox="0 0 1000 540" role="img" aria-labelledby="mapTitle mapDesc">
            <title id="mapTitle">世界关键矿产分布图</title>
            <desc id="mapDesc">世界地图上以不同颜色和大小标出关键矿产的主要、重要、新兴地区。</desc>
            <rect x="0" y="0" width="1000" height="540" rx="26" fill="#dbe9ee" />
            <g class="grid">
              <path d="M0 135H1000M0 270H1000M0 405H1000M250 0V540M500 0V540M750 0V540" />
            </g>
            <g class="land">
              <path d="M118 118c28-44 84-72 145-67 58 5 110 38 145 83 25 32 62 52 99 69 31 15 41 54 24 82-25 40-86 25-122 45-49 27-48 91-93 119-36 22-92 13-116-25-21-33-8-75-24-111-18-41-69-51-92-89-27-45 5-100 34-146z" />
              <path d="M388 175c35-30 91-32 132-11 39 20 66 61 62 104-5 53-50 70-72 112-19 37-8 96-47 120-39 23-88-8-103-50-14-39 8-73 6-111-2-42-37-65-39-106-1-23 19-42 61-58z" />
              <path d="M473 91c83-54 207-53 304-20 73 25 134 79 153 147 18 62-8 126-61 162-54 36-125 22-179 55-38 23-52 75-94 87-38 11-78-19-85-58-8-43 30-73 31-114 0-53-63-69-86-116-24-50-23-108 17-143z" />
              <path d="M682 271c48-27 102-7 132 36 29 41 39 101 10 145-30 46-93 52-132 18-38-34-41-93-34-138 4-25 9-50 24-61z" />
              <path d="M770 423c45-18 113-10 146 24 16 16 12 37-7 47-49 25-148 22-180-18-14-18 12-41 41-53z" />
              <path d="M436 62c30-27 74-33 106-13 20 13 10 39-18 47-42 12-89 2-88-34z" />
            </g>
            <g class="region-labels">
              <text x="215" y="92">北美</text>
              <text x="247" y="410">南美</text>
              <text x="493" y="159">欧洲 / 非洲</text>
              <text x="724" y="113">亚洲</text>
              <text x="795" y="454">澳大利亚</text>
            </g>
            <g id="markerLayer"></g>
          </svg>

          <aside class="legend" aria-label="图例">
            <h2>图例</h2>
            <div id="legendItems"></div>
            <div class="rank-legend">
              <span><i class="dot large"></i>主要</span>
              <span><i class="dot medium"></i>重要</span>
              <span><i class="dot small"></i>新兴</span>
            </div>
          </aside>
        </div>
      </section>

      <section class="detail-section" aria-label="矿产详情">
        <div class="section-title">
          <h2>重点区域</h2>
          <p id="summaryText">选择矿种查看对应国家与地区。</p>
        </div>
        <div class="cards" id="detailCards"></div>
      </section>
    </main>

    <footer>
      <p>注：本图为报告/教学用途的示意性分布，不替代精确 GIS 数据或最新储量统计。</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
